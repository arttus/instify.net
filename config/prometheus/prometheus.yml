# ============================================
# Prometheus Configuration for ODEUO
# Metrics collection and alerting rules
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'odeuo-production'
    environment: 'production'

# ============================================
# Alerting Configuration
# ============================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# ============================================
# Rules Configuration
# ============================================
rule_files:
  - "rules/*.yml"

# ============================================
# Scrape Configurations
# ============================================
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s

  # Application health checks
  - job_name: 'odeuo-web'
    static_configs:
      - targets: ['odeuo-web:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # n8n metrics (if available)
  - job_name: 'n8n'
    static_configs:
      - targets: ['n8n:5678']
    metrics_path: '/metrics'
    scrape_interval: 60s
    scrape_timeout: 10s

  # Livekit metrics (if available)
  - job_name: 'livekit'
    static_configs:
      - targets: ['livekit:7880']
    metrics_path: '/metrics'
    scrape_interval: 60s
    scrape_timeout: 10s

  # Docker container metrics (if cAdvisor is available)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

