# ============================================
# PostgreSQL Configuration for ODEUO
# Optimized for 4GB RAM DigitalOcean Droplet
# ============================================

# ============================================
# Connection Settings
# ============================================
listen_addresses = '*'  # Accept connections from all addresses
max_connections = 200
superuser_reserved_connections = 3

# ============================================
# Memory Settings (for 4GB RAM Droplet)
# ============================================
shared_buffers = 1GB                    # 25% of RAM
effective_cache_size = 3GB              # 75% of RAM
maintenance_work_mem = 256MB            # For maintenance operations
work_mem = 5MB                          # Per query operation
wal_buffers = 16MB                      # Write-ahead log buffers

# ============================================
# Write-Ahead Log (WAL) Settings
# ============================================
wal_level = replica                     # Enable replication
min_wal_size = 1GB                      # Minimum WAL size
max_wal_size = 4GB                      # Maximum WAL size
checkpoint_completion_target = 0.9      # Spread checkpoints
checkpoint_timeout = 10min              # Maximum time between checkpoints

# ============================================
# Query Planner Settings
# ============================================
random_page_cost = 1.1                 # SSD optimization
effective_io_concurrency = 200         # SSD concurrent I/O
seq_page_cost = 1.0                     # Sequential scan cost

# ============================================
# Logging Settings (Development - simplified)
# ============================================
log_destination = 'stderr'
logging_collector = off
# log_directory = '/var/log/postgresql'  # Disabled for development
# log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'  # Disabled for development
# log_file_mode = 0600  # Disabled for development
# log_truncate_on_rotation = on  # Disabled for development
# log_rotation_age = 1d  # Disabled for development
# log_rotation_size = 100MB  # Disabled for development

# Log line format
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'

# What to log
log_min_duration_statement = 1000      # Log slow queries (>1s)
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# ============================================
# Autovacuum Settings
# ============================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1

# ============================================
# Client Connection Defaults
# ============================================
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# ============================================
# Lock Management
# ============================================
deadlock_timeout = 1s
max_locks_per_transaction = 64

# ============================================
# Background Writer
# ============================================
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# ============================================
# Statistics Settings
# ============================================
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
# stats_temp_directory parameter was removed in PostgreSQL 15+

# ============================================
# Security Settings
# ============================================
ssl = off                               # Disabled for internal Docker network
password_encryption = scram-sha-256     # Modern password encryption

# ============================================
# Performance Monitoring
# ============================================
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
