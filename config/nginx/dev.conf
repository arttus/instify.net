# ============================================
# Service Subdomains (Development)
# ============================================

# Main Application
server {
    listen 80;
    server_name odeuo.local;

    # Increase body size for development uploads
    client_max_body_size 100M;

    location / {
        proxy_pass http://odeuo_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # Support for Next.js hot reload
        proxy_buffering off;
    }

    # API Routes
    location /api/ {
        proxy_pass http://odeuo_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health Check
    location /health {
        access_log off;
        return 200 "healthy - development mode\n";
        add_header Content-Type text/plain;
    }
}

# n8n Workflow Automation
server {
    listen 80;
    server_name n8n.odeuo.local;

    location / {
        proxy_pass http://n8n_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Handle WebSocket connections for n8n
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# RedisInsight Database Management
server {
    listen 80;
    server_name redis.odeuo.local;

    location / {
        proxy_pass http://redis-insight:5540;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# pgAdmin Database Management
server {
    listen 80;
    server_name pgadmin.odeuo.local;

    location / {
        proxy_pass http://pgadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # pgAdmin specific headers
        proxy_set_header X-Script-Name /;
        proxy_set_header X-Scheme $scheme;
    }
}

# Twenty CRM
server {
    listen 80;
    server_name crm.odeuo.local;

    client_max_body_size 100M;

    location / {
        proxy_pass http://twenty_crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # Support for hot reload
        proxy_buffering off;
    }
}

