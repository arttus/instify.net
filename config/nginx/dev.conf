# ============================================
# Development Nginx Configuration
# Simplified setup for local development
# ============================================

# ============================================
# Upstream Definitions
# ============================================
upstream instify_web {
    server instify-web:3001;
}

upstream n8n_backend {
    server n8n:5678;
}

# upstream livekit_backend {
#     server livekit:7880;
# }

# upstream pgadmin_backend {
#     server pgadmin:80;
# }

upstream redis_insight_backend {
    server redis-insight:8001;
}

# ============================================
# Main Development Server
# ============================================
server {
    listen 80;
    server_name instify.local localhost;

    # Increase body size for development uploads
    client_max_body_size 100M;

    # ============================================
    # Main Application (with hot reload support)
    # ============================================
    location / {
        proxy_pass http://instify_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Support for Next.js hot reload
        proxy_buffering off;
    }

    # ============================================
    # API Routes (no rate limiting in development)
    # ============================================
    location /api/ {
        proxy_pass http://instify_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # Longer timeout for debugging
    }

    # ============================================
    # Development Tools
    # ============================================
    
    # n8n Admin Interface (no auth in development)
    location /n8n/ {
        # Remove trailing slash and pass to n8n root
        rewrite ^/n8n/(.*) /$1 break;
        proxy_pass http://n8n_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Handle WebSocket connections for n8n
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Fix HTML content to use correct base path
        sub_filter 'src="/' 'src="/n8n/';
        sub_filter 'href="/' 'href="/n8n/';
        sub_filter 'action="/' 'action="/n8n/';
        sub_filter '"/' '"/n8n/';
        sub_filter_once off;
        sub_filter_types text/html text/css text/javascript application/javascript;

        # Fix redirects to include /n8n prefix
        proxy_redirect ~^/(.*)$ /n8n/$1;
        proxy_redirect / /n8n/;
    }

    # Handle n8n assets and API calls
    location ~ ^/n8n/(assets|api|rest|webhook|form|form-waiting|healthz|metrics|e2e|static)/ {
        rewrite ^/n8n/(.*) /$1 break;
        proxy_pass http://n8n_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # pgAdmin Database Interface
    # location /pgadmin/ {
    #     proxy_pass http://pgadmin_backend/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_redirect off;
    # }

    # RedisInsight Interface
    location /redis/ {
        proxy_pass http://redis_insight_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Livekit WebRTC (Development) - Temporarily disabled
    # ============================================
    # location /livekit/ {
    #     proxy_pass http://livekit_backend/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ============================================
    # Health Check Endpoint
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy - development mode\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # Development Status Page
    # ============================================
    location /dev-status {
        access_log off;
        return 200 "Development Environment Status:\n- Web App: http://instify.local/\n- n8n: http://instify.local/n8n/\n- pgAdmin: http://instify.local/pgadmin/\n- RedisInsight: http://instify.local/redis/\n- Livekit: http://instify.local/livekit/\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # Static Assets (with no caching for development)
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://instify_web;
        proxy_set_header Host $host;
        
        # Disable caching in development
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

# ============================================
# Service Subdomains (Development)
# ============================================

# n8n Workflow Automation
server {
    listen 80;
    server_name n8n.instify.local;

    location / {
        proxy_pass http://n8n_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Handle WebSocket connections for n8n
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# RedisInsight Database Management
server {
    listen 80;
    server_name redis.instify.local;

    location / {
        proxy_pass http://redis-insight:5540;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# pgAdmin Database Management
server {
    listen 80;
    server_name pgadmin.instify.local;

    location / {
        proxy_pass http://pgadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # pgAdmin specific headers
        proxy_set_header X-Script-Name /;
        proxy_set_header X-Scheme $scheme;
    }
}

