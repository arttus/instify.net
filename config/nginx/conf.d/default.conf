# ============================================
# Instify Main Server Configuration
# ============================================

# ============================================
# Upstream Definitions
# ============================================
upstream instify_web {
    least_conn;
    server instify-web:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream n8n_backend {
    server n8n:5678 max_fails=3 fail_timeout=30s;
}

upstream livekit_backend {
    server livekit:7880 max_fails=3 fail_timeout=30s;
}

# ============================================
# HTTP Server (Development/Redirect)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name instify.local localhost _;

    # Health check endpoint (always available)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # For development, serve directly
    # For production, redirect to HTTPS
    location / {
        # Development mode - proxy to app
        proxy_pass http://instify_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # For production, uncomment this line to redirect to HTTPS:
        # return 301 https://$server_name$request_uri;
    }

    # API Routes (with rate limiting)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://instify_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Webhook Routes (higher rate limit)
    location /api/webhooks/ {
        limit_req zone=webhook_limit burst=50 nodelay;
        proxy_pass http://instify_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authentication routes (stricter rate limiting)
    location ~ ^/(sign-in|sign-up|api/auth) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://instify_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # n8n Admin Interface (development access)
    location /n8n/ {
        proxy_pass http://n8n_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Livekit WebRTC
    location /livekit/ {
        proxy_pass http://livekit_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
