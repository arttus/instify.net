# ============================================
# Upstream Definitions (Production)
# ============================================
# Dummy upstreams to prevent nginx errors when server blocks are commented out
upstream odeuo_web {
    server 127.0.0.1:9999;  # Dummy - not used in development
}

upstream n8n_backend {
    server 127.0.0.1:9999;  # Dummy - not used in development
}

upstream livekit_backend {
    server 127.0.0.1:9999;  # Dummy - not used in development
}

