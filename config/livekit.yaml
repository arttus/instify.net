# ============================================
# Livekit Server Configuration
# Real-time Voice/Video for Instify
# ============================================

# ============================================
# Server Settings
# ============================================
port: 7880
bind_addresses:
  - ""

# ============================================
# RTC Configuration
# ============================================
rtc:
  # Port range for WebRTC connections
  port_range_start: 50000
  port_range_end: 60000
  
  # Use external IP for WebRTC (important for production)
  use_external_ip: true
  
  # ICE servers configuration
  ice_servers:
    - urls:
        - "stun:stun.l.google.com:19302"
        - "stun:stun1.l.google.com:19302"

# ============================================
# Redis Configuration (for clustering)
# ============================================
redis:
  address: "redis:6379"
  password: "${REDIS_PASSWORD}"
  db: 0

# ============================================
# API Keys (from environment variables)
# ============================================
keys:
  # These will be replaced by environment variables
  devkey: secret
  # In production, use:
  # ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

# ============================================
# Room Configuration
# ============================================
room:
  # Automatically create rooms when clients connect
  auto_create: true
  
  # Room timeout when empty (5 minutes)
  empty_timeout: 300s
  
  # Maximum participants per room
  max_participants: 100
  
  # Enable room recording
  enable_recording: false

# ============================================
# Audio Configuration
# ============================================
audio:
  # Audio codecs to support
  codecs:
    - mime: "audio/opus"
      fmtp: "minptime=10;useinbandfec=1"
    - mime: "audio/red"
    - mime: "audio/telephone-event"

# ============================================
# Video Configuration
# ============================================
video:
  # Video codecs to support
  codecs:
    - mime: "video/H264"
      fmtp: "level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=42001f"
    - mime: "video/H264"
      fmtp: "level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=42e01f"

# ============================================
# Logging Configuration
# ============================================
logging:
  level: info
  # Available levels: debug, info, warn, error
  
  # Log to file
  file: "/data/livekit.log"
  
  # Structured logging
  json: true

# ============================================
# Webhook Configuration
# ============================================
webhook:
  # Webhook URLs to notify about room events
  urls:
    - "http://instify-web:3000/api/webhooks/livekit"
  
  # API key for webhook authentication
  api_key: "${LIVEKIT_WEBHOOK_SECRET}"

# ============================================
# Turn Server (disabled for internal network)
# ============================================
turn:
  enabled: false
  # For production with external clients, you might want to enable TURN
  # enabled: true
  # domain: "turn.yourdomain.com"
  # cert_file: "/path/to/cert.pem"
  # key_file: "/path/to/key.pem"

# ============================================
# Development Settings
# ============================================
development:
  # Disable in production
  disable_strict_config: false
  
  # Log all RTC packets (very verbose, dev only)
  log_rtc_packets: false

# ============================================
# Performance Tuning
# ============================================
# CPU usage limits
cpu_cost:
  # Maximum CPU cores to use for video processing
  video_cpu_count: 2
  
  # Maximum CPU cores to use for audio processing  
  audio_cpu_count: 1

# Memory limits
memory:
  # Maximum memory usage in MB
  max_memory_mb: 1024
