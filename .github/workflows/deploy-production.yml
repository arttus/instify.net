name: Deploy to Production

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Type of deployment'
        required: true
        default: 'code-only'
        type: choice
        options:
          - code-only
          - containers
          - n8n-only
          - full-rebuild
      restart_services:
        description: 'Services to restart (comma-separated)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
        
    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
        
    - name: Determine deployment type
      id: deployment
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "type=${{ github.event.inputs.deployment_type }}" >> $GITHUB_OUTPUT
          echo "restart_services=${{ github.event.inputs.restart_services }}" >> $GITHUB_OUTPUT
        else
          # Auto-detect based on changed files
          if git diff --name-only HEAD~1 HEAD | grep -E "(docker-compose|Dockerfile|package\.json)" > /dev/null; then
            echo "type=containers" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -E "config/n8n/" > /dev/null; then
            echo "type=n8n-only" >> $GITHUB_OUTPUT
          else
            echo "type=code-only" >> $GITHUB_OUTPUT
          fi
          echo "restart_services=" >> $GITHUB_OUTPUT
        fi
        
    - name: Deploy to production server
      run: |
        ssh -o StrictHostKeyChecking=no deploy@${{ secrets.SERVER_IP }} << 'ENDSSH'
          set -e
          
          # Navigate to deployment directory
          cd /home/deploy/instify
          
          # Make update script executable
          chmod +x scripts/update-production.sh
          
          # Determine deployment command
          DEPLOYMENT_TYPE="${{ steps.deployment.outputs.type }}"
          RESTART_SERVICES="${{ steps.deployment.outputs.restart_services }}"
          
          case "$DEPLOYMENT_TYPE" in
            "code-only")
              ./scripts/update-production.sh --code-only
              ;;
            "containers")
              ./scripts/update-production.sh --containers
              ;;
            "n8n-only")
              ./scripts/update-production.sh --n8n
              ;;
            "full-rebuild")
              ./scripts/update-production.sh --containers --force-rebuild
              ;;
            *)
              echo "Unknown deployment type: $DEPLOYMENT_TYPE"
              exit 1
              ;;
          esac
          
          # Restart specific services if requested
          if [[ -n "$RESTART_SERVICES" ]]; then
            ./scripts/update-production.sh --restart "$RESTART_SERVICES"
          fi
          
          echo "Deployment completed successfully!"
        ENDSSH
        
    - name: Verify deployment
      run: |
        # Wait for services to stabilize
        sleep 30
        
        # Check main application
        if curl -f -s https://instify.net/api/health > /dev/null; then
          echo "✅ Main application is healthy"
        else
          echo "❌ Main application health check failed"
          exit 1
        fi
        
        # Check n8n
        if curl -f -s https://n8n.instify.net/healthz > /dev/null; then
          echo "✅ n8n is healthy"
        else
          echo "⚠️ n8n health check failed (may be expected if n8n wasn't updated)"
        fi
        
    - name: Notify on success
      if: success()
      run: |
        echo "🎉 Deployment to production completed successfully!"
        echo "Deployment type: ${{ steps.deployment.outputs.type }}"
        if [[ -n "${{ steps.deployment.outputs.restart_services }}" ]]; then
          echo "Restarted services: ${{ steps.deployment.outputs.restart_services }}"
        fi
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for details."
        echo "You may need to manually rollback or fix the issue."
