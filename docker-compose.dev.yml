# ============================================
# Development Override for Docker Compose
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================

version: '3.8'

services:
  # ============================================
  # Development Web Application
  # ============================================
  instify-web:
    build:
      target: deps  # Stop at deps stage for development
    command: npm run dev
    environment:
      - NODE_ENV=development
      - DEBUG=true
      - SKIP_ENV_VALIDATION=true
      - WATCHPACK_POLLING=true
    volumes:
      # Mount source code for hot reload
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3001"  # Map host port 3000 to container port 3001
      - "9229:9229"  # Node.js debugging port

  # ============================================
  # Development Database (with exposed port)
  # ============================================
  postgres:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=instify_dev
    volumes:
      # Add development seed data
      - ./scripts/dev-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  # ============================================
  # Development Redis (with exposed port)
  # ============================================
  redis:
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    # Remove password requirement for development
    environment: []

  # ============================================
  # Development n8n (access via n8n.instify.local subdomain)
  # ============================================
  n8n:
    # ports:
    #   - "5678:5678"  # Removed - access via n8n.instify.local subdomain
    environment:
      - NODE_ENV=development
      - N8N_LOG_LEVEL=debug
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      # Mount workflows for development
      - ./config/n8n/workflows:/home/node/.n8n/workflows
      - ./config/n8n/credentials:/home/node/.n8n/credentials

  # ============================================
  # Development Livekit (with debug logging)
  # ============================================
  livekit:
    ports:
      - "7880:7880"
      - "7881:7881"
    volumes:
      - ./config/livekit-dev.yaml:/livekit.yaml:ro
    environment:
      - LIVEKIT_LOG_LEVEL=debug

  # ============================================
  # LiveKit Agents (Voice AI)
  # ============================================
  livekit-agents:
    build:
      context: ./agents
      dockerfile: Dockerfile.dev
    container_name: instify-livekit-agents-dev
    restart: unless-stopped
    environment:
      # LiveKit Connection
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

      # AI Services
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Speech Services (Optional - for advanced configurations)
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY:-}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}

      # Agent Configuration
      - AGENT_MODE=dev
      - AGENT_LOG_LEVEL=debug
      - PYTHONUNBUFFERED=1

      # Development Settings
      - WATCHDOG_ENABLED=true
      - HOT_RELOAD=true
    volumes:
      # Mount agent source code for hot reload
      - ./agents:/app/agents:ro
      - ./agents/config:/app/config:ro
      - ./agents/models:/app/models
      # Mount logs for debugging
      - ./logs/agents:/app/logs
    networks:
      - instify-network
    depends_on:
      - livekit
      - redis
    ports:
      - "8000:8000"  # Agent management API
      - "8001:8001"  # Agent metrics/health
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Development Tools
  # ============================================
  
  # Database Admin (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: instify-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@instify.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    networks:
      - instify-network
    depends_on:
      - postgres

  # Redis Admin (RedisInsight) - Access via redis.instify.local
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: instify-redis-insight
    restart: unless-stopped
    # ports:
    #   - "8002:8001"  # Removed - access via redis.instify.local subdomain
    networks:
      - instify-network
    depends_on:
      - redis

  # ============================================
  # Development Nginx (simplified)
  # ============================================
  nginx:
    volumes:
      # Use development nginx config
      - ./config/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      # Remove HTTPS port for development
    depends_on:
      - instify-web
      - n8n
      - livekit
      - pgadmin
      - redis-insight
