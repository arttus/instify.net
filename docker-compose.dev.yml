# ============================================
# Development Override for Docker Compose
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================

version: '3.8'

services:
  # ============================================
  # Development Web Application
  # ============================================
  odeuo-web:
    build:
      target: development  # Use development stage with source code baked in
    environment:
      - NODE_ENV=development
      - DEBUG=true
      - SKIP_ENV_VALIDATION=true
      - WATCHPACK_POLLING=true
      - WEB_PORT=3001  # Override the port to avoid conflict with Twenty CRM
    ports:
      - "3005:3001"  # Map host port 3005 to container port 3001 (temporary workaround for port conflict)
      - "9229:9229"  # Node.js debugging port

  # ============================================
  # Development Database (with exposed port)
  # ============================================
  postgres:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=odeuo_dev
      # Twenty CRM database credentials (for init script)
      - TWENTY_DB_USER=${TWENTY_DB_USER:-twenty}
      - TWENTY_DB_PASSWORD=${TWENTY_DB_PASSWORD}
      - TWENTY_DB_NAME=${TWENTY_DB_NAME:-twenty}
    volumes:
      # Add development seed data
      - ./scripts/dev-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro

  # ============================================
  # Development Redis (with exposed port)
  # ============================================
  redis:
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    # Remove password requirement for development
    environment: []

  # ============================================
  # Development n8n (access via n8n.odeuo.local subdomain)
  # ============================================
  n8n:
    # ports:
    #   - "5678:5678"  # Removed - access via n8n.odeuo.local subdomain
    environment:
      - NODE_ENV=development
      - N8N_LOG_LEVEL=debug
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      # Mount workflows for development
      - ./config/n8n/workflows:/home/node/.n8n/workflows
      - ./config/n8n/credentials:/home/node/.n8n/credentials

  # ============================================
  # Development Livekit (with debug logging)
  # ============================================
  livekit:
    ports:
      - "7880:7880"
      - "7881:7881"
    volumes:
      - ./config/livekit-dev.yaml:/livekit.yaml:ro
    environment:
      - LIVEKIT_LOG_LEVEL=debug

  # ============================================
  # LiveKit Agents (Voice AI)
  # ============================================
  livekit-agents:
    build:
      context: ./agents
      dockerfile: Dockerfile.dev
    container_name: odeuo-livekit-agents-dev
    restart: unless-stopped
    environment:
      # LiveKit Connection
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

      # AI Services
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Speech Services (Optional - for advanced configurations)
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY:-}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}

      # Agent Configuration
      - AGENT_MODE=dev
      - AGENT_LOG_LEVEL=debug
      - PYTHONUNBUFFERED=1

      # Development Settings
      - WATCHDOG_ENABLED=true
      - HOT_RELOAD=true
    volumes:
      # Mount agent source code for hot reload
      - ./agents:/app/agents:ro
      - ./agents/config:/app/config:ro
      - ./agents/models:/app/models
      # Mount logs for debugging
      - ./logs/agents:/app/logs
    networks:
      - odeuo-network
    depends_on:
      - livekit
      - redis
    ports:
      - "8000:8000"  # Agent management API
      - "8001:8001"  # Agent metrics/health
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Development Tools
  # ============================================

  # Database Admin (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: odeuo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@odeuo.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    networks:
      - odeuo-network
    depends_on:
      - postgres

  # Redis Admin (RedisInsight) - Access via redis.odeuo.local
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: odeuo-redis-insight
    restart: unless-stopped
    # ports:
    #   - "8002:8001"  # Removed - access via redis.odeuo.local subdomain
    networks:
      - odeuo-network
    depends_on:
      - redis

  # ============================================
  # Twenty CRM Server (Development)
  # ============================================
  twenty-server:
    image: twentycrm/twenty:latest
    container_name: odeuo-twenty-server
    restart: unless-stopped
    environment:
      # Database Configuration
      PG_DATABASE_URL: "postgresql://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD}@postgres:5432/${TWENTY_DB_NAME:-twenty}"

      # Redis Configuration
      REDIS_URL: "redis://redis:6379"

      # Server Configuration
      SERVER_URL: "${TWENTY_SERVER_URL:-http://crm.odeuo.local}"
      FRONT_BASE_URL: "${TWENTY_FRONT_BASE_URL:-http://crm.odeuo.local}"

      # Security - JWT Tokens (use environment variables)
      ACCESS_TOKEN_SECRET: "${TWENTY_APP_SECRET}"
      REFRESH_TOKEN_SECRET: "${TWENTY_APP_SECRET}"
      APP_SECRET: "${TWENTY_APP_SECRET}"
      LOGIN_TOKEN_SECRET: "${TWENTY_APP_SECRET}"
      REFRESH_TOKEN_EXPIRES_IN: "90d"
      ACCESS_TOKEN_EXPIRES_IN: "30m"

      # Node Environment
      NODE_ENV: development
      LOG_LEVEL: "${TWENTY_LOG_LEVEL:-debug}"

      # Database Migrations - ENABLE for first run to initialize schema
      ENABLE_DB_MIGRATIONS: "true"

      # Optional: Integrations
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Storage Configuration
      STORAGE_TYPE: "local"
      STORAGE_LOCAL_PATH: "/app/data"

    ports:
      - "3002:3000"  # Twenty server port

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - odeuo-network

    volumes:
      - twenty_server_data:/app/data
      - ./logs/twenty:/app/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # Increased to allow for migrations

  # ============================================
  # Twenty CRM Worker (Development)
  # ============================================
  twenty-worker:
    image: twentycrm/twenty:latest
    container_name: odeuo-twenty-worker
    restart: unless-stopped
    command: npm run worker:prod
    environment:
      # Database Configuration
      PG_DATABASE_URL: "postgresql://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD}@postgres:5432/${TWENTY_DB_NAME:-twenty}"

      # Redis Configuration
      REDIS_URL: "redis://redis:6379"

      # Server Configuration
      SERVER_URL: "${TWENTY_SERVER_URL:-http://crm.odeuo.local}"

      # Security - JWT Tokens (use environment variables)
      ACCESS_TOKEN_SECRET: "${TWENTY_APP_SECRET}"
      REFRESH_TOKEN_SECRET: "${TWENTY_APP_SECRET}"
      APP_SECRET: "${TWENTY_APP_SECRET}"
      LOGIN_TOKEN_SECRET: "${TWENTY_APP_SECRET}"

      # Node Environment
      NODE_ENV: development
      LOG_LEVEL: "${TWENTY_LOG_LEVEL:-debug}"

      # Database Migrations - Disabled for worker
      ENABLE_DB_MIGRATIONS: "false"

      # Storage Configuration
      STORAGE_TYPE: "local"
      STORAGE_LOCAL_PATH: "/app/data"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      twenty-server:
        condition: service_healthy

    networks:
      - odeuo-network

    volumes:
      - twenty_server_data:/app/data  # Share data volume with server
      - ./logs/twenty-worker:/app/logs

    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]  # Simple health check for worker
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Development Nginx (simplified)
  # ============================================
  nginx:
    volumes:
      # Use development nginx config
      - ./config/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      # Remove HTTPS port for development
    depends_on:
      - odeuo-web
      - n8n
      - livekit
      - pgadmin
      - redis-insight
      - twenty-server


# ============================================
# Development Volumes
# ============================================
volumes:
  twenty_server_data:
    driver: local
    name: odeuo-twenty-data-dev