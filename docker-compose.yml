version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    build:
      context: ./config/postgres
      dockerfile: Dockerfile
    image: odeuo-postgres:latest
    container_name: odeuo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: odeuo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: odeuo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - odeuo-network
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odeuo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # PostgreSQL Backup Service
  # ============================================
  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: odeuo-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: odeuo
      POSTGRES_USER: odeuo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "${BACKUP_SCHEDULE:-@daily}"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      POSTGRES_EXTRA_OPTS: "-Z9 --schema=public --blobs"
    volumes:
      - ./backups:/backups
    networks:
      - odeuo-network

  # ============================================
  # Redis (Cache + Message Queue)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: odeuo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - odeuo-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Web Application (Next.js + CopilotKit)
  # ============================================
  odeuo-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odeuo-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678}
      - REDIS_URL=${REDIS_URL}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - odeuo-network
    volumes:
      - ./logs/web:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Livekit (Real-time Voice/Video)
  # ============================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: odeuo-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"   # HTTP
      - "7881:7881"   # gRPC
      - "7882:7882/udp" # WebRTC
    volumes:
      - ./config/livekit.yaml:/livekit.yaml:ro
      - livekit_data:/data
    command: --config /livekit.yaml
    networks:
      - odeuo-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # n8n (Automation Workflows)
  # ============================================
  n8n:
    image: n8nio/n8n:latest
    container_name: odeuo-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_SECURE_COOKIE=false
      - NODE_ENV=${NODE_ENV:-production}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://odeuo.local:5678}
      - GENERIC_TIMEZONE=${TIMEZONE:-America/New_York}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=odeuo
      - DB_POSTGRESDB_USER=odeuo
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=n8n
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config/n8n:/home/node/.n8n/custom:ro
      - ./logs/n8n:/home/node/.n8n/logs
      - ./RAG-data:/data/RAG-data:ro
    networks:
      - odeuo-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "${N8N_USER:-admin}:${N8N_PASSWORD}", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: odeuo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - odeuo-network
    depends_on:
      - n8n
      - livekit
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # File Watcher (Automated Knowledge Base Ingestion)
  # ============================================
  file-watcher:
    build:
      context: ./file-watcher
      dockerfile: Dockerfile
    container_name: odeuo-file-watcher
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/knowledge/file-watcher}
      - WATCH_PATH=/data/RAG-data
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID:-default-tenant}
      - DEFAULT_CONTENT_TYPE=${DEFAULT_CONTENT_TYPE:-legal_knowledge}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SCAN_ON_STARTUP=true
      - DEBOUNCE_DELAY=2000
      - MAX_FILE_SIZE=10485760
      - MIN_CONTENT_LENGTH=50
      - MAX_RETRIES=3
      - PORT=8080
    volumes:
      - ./RAG-data:/data/RAG-data:ro
      - ./logs/file-watcher:/app/logs
      - file_watcher_data:/app/data
    networks:
      - odeuo-network
    depends_on:
      n8n:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"  # Health checks only, not exposed externally
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  livekit_data:
    driver: local
  file_watcher_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  odeuo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
