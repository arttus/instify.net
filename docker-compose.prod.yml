# ============================================
# Production Docker Compose Configuration
# ODEUO Platform - DigitalOcean Deployment
# ============================================

version: '3.8'

services:
  # ============================================
  # Production Database (PostgreSQL 16)
  # ============================================
  postgres:
    build:
      context: ./config/postgres
      dockerfile: Dockerfile
    image: odeuo-postgres:latest
    container_name: odeuo-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./config/postgres/postgresql.prod.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost access
    networks:
      - odeuo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ============================================
  # Production Cache (Redis 7)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: odeuo-redis-prod
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # Only localhost access
    networks:
      - odeuo-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ============================================
  # Production Web Application (Next.js)
  # ============================================
  odeuo-web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: production
    container_name: odeuo-web-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - odeuo-network
    volumes:
      - ./logs/web:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ============================================
  # Production LiveKit Server
  # ============================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: odeuo-livekit-prod
    restart: unless-stopped
    ports:
      - "7880:7880"   # HTTP
      - "7881:7881"   # gRPC
      - "50000-50100:50000-50100/udp"  # WebRTC
    volumes:
      - ./config/livekit.prod.yaml:/livekit.yaml:ro
      - livekit_data:/data
    command: --config /livekit.yaml
    networks:
      - odeuo-network
    environment:
      - LIVEKIT_EXTERNAL_IP=${SERVER_IP}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ============================================
  # Production LiveKit Agents (Voice AI)
  # ============================================
  livekit-agents:
    build:
      context: ./agents
      dockerfile: Dockerfile.prod
    container_name: odeuo-livekit-agents-prod
    restart: unless-stopped
    environment:
      # LiveKit Connection
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      
      # AI Services
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      
      # Production Configuration
      - AGENT_MODE=production
      - AGENT_LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    volumes:
      - ./agents/models:/app/models
      - ./logs/agents:/app/logs
    networks:
      - odeuo-network
    depends_on:
      - livekit
      - redis
    ports:
      - "127.0.0.1:8001:8001"  # Health checks only
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ============================================
  # Production Workflow Automation (n8n)
  # ============================================
  n8n:
    image: n8nio/n8n:latest
    container_name: odeuo-n8n-prod
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_NAME}
      - DB_POSTGRESDB_USER=${DB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=n8n
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config/n8n:/home/node/.n8n/custom:ro
      - ./logs/n8n:/home/node/.n8n/logs
      - ./RAG-data:/data/RAG-data:ro
    networks:
      - odeuo-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # ============================================
  # Production Reverse Proxy (Nginx)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: odeuo-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - odeuo-network
    depends_on:
      - odeuo-web
      - n8n
      - livekit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ============================================
  # Production Database Backup
  # ============================================
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: odeuo-postgres-backup-prod
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "${BACKUP_SCHEDULE:-@daily}"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      POSTGRES_EXTRA_OPTS: "-Z9 --schema=public --blobs"
    volumes:
      - ./backups:/backups
    networks:
      - odeuo-network
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # Production File Watcher (Automated Knowledge Base Ingestion)
  # ============================================
  file-watcher:
    build:
      context: ./file-watcher
      dockerfile: Dockerfile
    container_name: odeuo-file-watcher-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - WATCH_PATH=/data/RAG-data
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID}
      - DEFAULT_CONTENT_TYPE=${DEFAULT_CONTENT_TYPE:-legal_knowledge}
      - LOG_LEVEL=info
      - SCAN_ON_STARTUP=true
      - DEBOUNCE_DELAY=2000
      - MAX_FILE_SIZE=10485760
      - MIN_CONTENT_LENGTH=50
      - MAX_RETRIES=3
      - PORT=8080
    volumes:
      - ./RAG-data:/data/RAG-data:ro
      - ./logs/file-watcher:/app/logs
      - file_watcher_data:/app/data
    networks:
      - odeuo-network
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

# ============================================
# Production Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  livekit_data:
    driver: local
  file_watcher_data:
    driver: local

# ============================================
# Production Networks
# ============================================
networks:
  odeuo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
